# Yasui Configuration - Paper 1.21.8 Server Optimization Plugin

optimizations:
  # Hopper optimization using NMS full-check caching
  hopper:
    enabled: true
    # Short-circuit isFullContainer with a tiny TTL cache (NMS hook)
    full-cache-enabled: true
    full-cache-ttl-ticks: 2
    # Optional: cache "not full" results for the same container briefly (use carefully).
    full-cache-negative-enabled: false
    full-cache-negative-ttl-ticks: 1
    full-cache-invalidate-on-event: true

  # Villager POI optimization
  villager-poi:
    enabled: true
    # Restore cached job site memory when safe
    restore-job-site: true
    # AcquirePoi search cache (NMS hook)
    acquire-poi-cache:
      enabled: true
      ttl-ticks: 100
      ttl-jitter-ticks: 10
      max-entries: 20000
      cache-empty-results: false
      # Use position predicate in search (faster misses, can change retry behavior).
      predicate-aware: false
      # Bucket X/Z source positions to improve cache hits (1 = exact position).
      source-bucket-size: 2
      # If cached results are insufficient, optionally fall back to a full search.
      fallback-on-insufficient: false
    competitor-scan-cache:
      enabled: true
      ttl-ticks: 10
      ttl-jitter-ticks: 10
      max-entries: 10000
      cache-empty-results: false

  # Entity distance cache - no tick freezing; used for quick near/distant checks
  entity-spread:
    enabled: true
    # Scan interval for updating distance categories (in ticks)
    scan-interval: 100
    # Distance threshold in blocks - entities within this range tick normally
    near-distance: 32

  # Pathfinding result cache (short TTL, preserves vanilla behavior)
  pathfinding-cache:
    enabled: true
    ttl-ticks: 2
    ttl-jitter-ticks: 3
    # Per-navigation LRU size (keeps recent path results per mob).
    max-entries-per-nav: 4
    # Invalidate cached paths when mob moves beyond this block distance.
    mob-move-threshold: 0
    # Invalidate cached paths when target moves beyond this block distance.
    target-move-threshold: 1
    # Cache failed path results for a short time (0 = disabled).
    negative-ttl-ticks: 0
