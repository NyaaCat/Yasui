# Yasui Configuration - Paper 1.21.8 Server Optimization Plugin

optimizations:
  # Hopper optimization using NMS full-check caching
  hopper:
    enabled: true
    # Short-circuit isFullContainer with a tiny TTL cache (NMS hook)
    full-cache-enabled: true
    full-cache-ttl-ticks: 2
    # Optional: cache "not full" results for the same container briefly (use carefully).
    full-cache-negative-enabled: false
    full-cache-negative-ttl-ticks: 1
    full-cache-invalidate-on-event: true

  # Villager POI optimization
  villager-poi:
    enabled: true
    # Restore cached job site memory when safe
    restore-job-site: true
    # AcquirePoi search cache (NMS hook)
    acquire-poi-cache:
      enabled: true
      ttl-ticks: 100
      ttl-jitter-ticks: 10
      max-entries: 20000
      cache-empty-results: false
      # Use position predicate in search (faster misses, can change retry behavior).
      predicate-aware: false
      # Bucket X/Z source positions to improve cache hits (1 = exact position).
      source-bucket-size: 2
      # If cached results are insufficient, optionally fall back to a full search.
      fallback-on-insufficient: false
      # Renew TTL on cache hits (use carefully in dynamic villages).
      renew-on-hit: false
    competitor-scan-cache:
      enabled: true
      ttl-ticks: 10
      ttl-jitter-ticks: 10
      max-entries: 10000
      cache-empty-results: false
      renew-on-hit: false
    # PoiAccess lookup cache (findAny/findClosest)
    poi-lookup-cache:
      enabled: true
      ttl-ticks: 100
      ttl-jitter-ticks: 10
      max-entries: 20000
      cache-empty-results: false
      predicate-aware: true
      source-bucket-size: 2
      renew-on-hit: false
    # PoiManager getType/exists cache
    poi-type-cache:
      enabled: true
      ttl-ticks: 100
      ttl-jitter-ticks: 10
      max-entries: 20000
      cache-empty-results: true
      predicate-aware: true
      renew-on-hit: false

  # Chunk epoch tracker to invalidate caches on block/POI changes
  chunk-epoch:
    enabled: true

  # Entity distance cache - no tick freezing; used for quick near/distant checks
  entity-spread:
    enabled: true
    # Scan interval for updating distance categories (in ticks)
    scan-interval: 100
    # Distance threshold in blocks - entities within this range tick normally
    near-distance: 32

  # Pathfinding result cache (short TTL, preserves vanilla behavior)
  pathfinding-cache:
    enabled: true
    ttl-ticks: 2
    ttl-jitter-ticks: 3
    # Per-navigation LRU size (keeps recent path results per mob).
    max-entries-per-nav: 4
    # Invalidate cached paths when mob moves beyond this block distance.
    mob-move-threshold: 1
    # Invalidate cached paths when target moves beyond this block distance.
    target-move-threshold: 1
    # Cache failed path results for a short time (0 = disabled).
    negative-ttl-ticks: 1

  # Hot chunk detection and cache boosts (gradual decay)
  hot-chunks:
    enabled: true
    # Scan interval for chunk heat updates (in ticks)
    scan-interval: 40
    # Mark chunks hot when mob count approaches this threshold
    mob-threshold: 64
    # Count nearby chunks as a single area (0 = per-chunk only, 1 = 3x3 area)
    area-radius: 1
    # Reuse entity-spread snapshots to avoid extra scans
    use-entity-spread-snapshots: true
    # Max snapshot age before fallback scan (ms, 0 = always accept)
    snapshot-max-age-ms: 10000
    # Heat decay per scan (0-1), lower = faster cooldown
    heat-decay: 0.85
    # Minimum heat to keep a chunk tracked
    min-heat: 0.15
    # Spread AI ticks across groups in hot chunks (0 = disabled)
    tick-groups: 0
    # Rescan loaded chunks in batches to refresh tick group PDCs
    tick-group-rescan-chunks: 16
    # Persist villager POI cache in hot chunks to avoid load hitches
    villager-pdc:
      enabled: true
    # Static villager handling for trade farms (hot chunks only)
    villager-static:
      enabled: true
      # Consider a villager static if it hasn't moved for this long
      stable-ticks: 100
      # Movement threshold (blocks) to reset static timer
      move-threshold: 0.25
      # Skip scans for static villagers until this interval elapses
      scan-interval-ticks: 200
    # Cache boosts applied in hot chunks (linearly scaled by heat)
    pathfinding-cache:
      enabled: true
      ttl-ticks: 8
      ttl-jitter-ticks: 8
      mob-move-threshold: 1
      target-move-threshold: 2
      negative-ttl-ticks: 1
    acquire-poi-cache:
      enabled: true
      ttl-ticks: 200
      ttl-jitter-ticks: 200
      renew-on-hit: true
    competitor-scan-cache:
      enabled: true
      ttl-ticks: 100
      ttl-jitter-ticks: 100
      renew-on-hit: true
    poi-lookup-cache:
      enabled: true
      ttl-ticks: 200
      ttl-jitter-ticks: 20
      renew-on-hit: true
    poi-type-cache:
      enabled: true
      ttl-ticks: 200
      ttl-jitter-ticks: 20
      renew-on-hit: true
