# Yasui Configuration - Paper 1.21.8 Server Optimization Plugin

optimizations:
  # Hopper optimization using event-driven tracking + async pre-computation
  hopper:
    enabled: true
    # Async scan interval in ticks (5 = every 5 ticks)
    async-scan-interval: 5
    # Cache time-to-live in milliseconds
    cache-ttl: 1000

  # Villager POI (Point of Interest) caching to reduce repeated lookups
  villager-poi:
    enabled: true
    cache-poi-lookups: true
    # Rules for which villagers to optimize
    # Each rule specifies: type, named (true/false), distance threshold, and optimize flag
    rules:
      - type: VILLAGER
        named: true
        distance: ">64"
        optimize: true
      - type: VILLAGER
        named: false
        distance: ">32"
        optimize: true

  # Entity spread ticking - distant entities tick less frequently
  entity-spread:
    enabled: true
    # Scan interval for updating distance categories (in ticks)
    scan-interval: 100
    # Distance threshold in blocks - entities within this range tick normally
    near-distance: 32
    # Rules for spread ticking intervals
    # spread-interval: 1 = every tick (no optimization), 2 = every other tick, 4 = every 4th tick, etc.
    rules:
      - type: VILLAGER
        named: true
        spread-interval: 4
      - type: VILLAGER
        named: false
        spread-interval: 4
      - type: ZOMBIE
        named: false
        spread-interval: 2
      - type: SKELETON
        named: false
        spread-interval: 2
      - type: CREEPER
        named: false
        spread-interval: 2

  # Chunk random tick position caching to reduce position recalculation
  chunk-cache:
    enabled: true
    cache-random-tick-positions: true
