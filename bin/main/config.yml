# Yasui Configuration - Paper 1.21.8 Server Optimization Plugin

optimizations:
  # Hopper optimization using event-driven tracking + periodic pre-computation
  hopper:
    enabled: true
    # Scan interval in ticks (5 = every 5 ticks)
    async-scan-interval: 5
    # Cache time-to-live in milliseconds
    cache-ttl: 1000
    # Max hoppers to scan per tick to avoid spikes
    max-scan-per-tick: 200
    # Max hoppers to scan per tick to avoid spikes

  # Villager POI (Point of Interest) caching to reduce repeated lookups
  # All villagers are optimized by default for simplicity
  villager-poi:
    enabled: true
    cache-poi-lookups: true

  # Entity distance cache - no tick freezing; used to gate expensive optimizations
  entity-spread:
    enabled: true
    # Scan interval for updating distance categories (in ticks)
    scan-interval: 100
    # Distance threshold in blocks - entities within this range tick normally
    near-distance: 32
    # Legacy spread-interval rules are currently unused (tick freezing removed)
    default-interval: 2
    rules: []

  # Chunk random tick position caching to reduce position recalculation
  # DISABLED: Not implemented in this build; keep false to avoid overhead
  chunk-cache:
    enabled: false
    cache-random-tick-positions: true
